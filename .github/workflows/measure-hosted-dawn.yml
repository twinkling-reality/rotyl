name: Measure hosted Dawn

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel virtual Mac
            runner: macos-15-intel
            result: hosted-results-intel.json
            artifact: hosted-dawn-intel
          - name: GPU larger Mac
            runner: macos-15-xlarge
            result: hosted-results-xlarge.json
            artifact: hosted-dawn-xlarge
    steps:
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.9

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure the hosted runner
        run: node tools/ci-bench/hosted.mjs --cycles 16 --output tools/ci-bench/${{ matrix.result }}

      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: tools/ci-bench/${{ matrix.result }}
